components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_to_name:
          type: string
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        customer_name:
          type: string
          nullable: true
          readOnly: true
        lead_name:
          type: string
          nullable: true
          readOnly: true
        opportunity_name:
          type: string
          readOnly: true
          nullable: true
        subject:
          type: string
          maxLength: 200
        activity_type:
          $ref: '#/components/schemas/ActivityTypeEnum'
        description:
          type: string
        status:
          $ref: '#/components/schemas/ActivityStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        due_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        customer:
          type: integer
          nullable: true
        lead:
          type: integer
          nullable: true
        opportunity:
          type: integer
          nullable: true
        assigned_to:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - activity_type
      - assigned_to_name
      - completed_at
      - created_at
      - created_by
      - created_by_name
      - customer_name
      - id
      - lead_name
      - opportunity_name
      - subject
      - updated_at
    ActivityStatusEnum:
      enum:
      - PLANNED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PLANNED` - Planned
        * `IN_PROGRESS` - In Progress
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    ActivityTypeEnum:
      enum:
      - CALL
      - MEETING
      - EMAIL
      - TASK
      - FOLLOW_UP
      type: string
